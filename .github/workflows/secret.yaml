# .github/workflows/secret.yaml
# -----------------------------------------------------------------------------
# Redacto secret-scanning stub. Calls the centralized reusable gitleaks workflow
# in redactolabs/security-workflows. Keep this file THIN — scan logic, history
# fetch, baseline handling and Slack formatting all live in the reusable workflow.
#
# Per-repo tuning lives in two files at the repo ROOT, not here:
#   .gitleaks.toml           -> allowlist of false-positive CLASSES (prefer this:
#                               a regex matches the VALUE, so it survives rebases,
#                               cherry-picks and lines moving)
#   .gitleaksignore          -> fingerprints (commit:path:rule:line) for findings
#                               too generic to allowlist by value. These go stale
#                               when the commit they name is rewritten.
#   .gitleaks-baseline.json  -> accepted legacy findings (added AFTER rotation)
#
# This stub is identical across repos and across staging/main. The only per-repo
# difference is .gitleaks.toml. Copy as-is to other consumer repos.
# -----------------------------------------------------------------------------
name: secret scan

on:
  # Scan a branch when a PR TARGETS staging or main — catches secrets at the gate,
  # before they merge into a protected branch. This trigger is also what lets you
  # make the scan a REQUIRED status check (a required check must run on the PR).
  pull_request:
    branches: [staging, main]

  # Safety net for direct pushes to the protected branches.
  push:
    branches: [staging, main]

  # Manual run from the Actions tab (handy for re-testing after committing .gitleaks.toml).
  workflow_dispatch:

# Least privilege: the scan only needs to read the repo.
permissions:
  contents: read

jobs:
  gitleaks:
    # Pinned to @v1. If you've cut a v2 of the reusable workflow, change this tag.
    uses: redactolabs/security-workflows/.github/workflows/gitleaks.yml@v1
    with:
      # Scan only the commits this PR or push introduces, instead of every commit
      # on every branch in the repo. Without this, a finding that exists only on
      # an unrelated branch (a demo or feature branch) fails a PR that does not
      # contain it — which blocked three atlas releases into main before this.
      #
      # The scan still reads .gitleaks.toml / .gitleaksignore from the BASE branch,
      # so a PR cannot allowlist its own findings. That is unchanged.
      #
      # Remove this line to go back to scanning all branches; the reusable
      # workflow defaults to "full".
      scan-scope: pr
    secrets:
      # Reuses the existing org-level Dependabot webhook (same Slack channel).
      # The reusable workflow declares this input as SLACK_WEBHOOK_URL.
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_DEPENDABOT_WEBHOOK_URL }}
