name: Backup Repo to GCS
on:
  schedule:
    - cron: '30 20 * * 1-5'   # Every Monday-Friday at 02:00 IST (20:30 UTC previous day)
  workflow_dispatch:
env:
  BUCKET: ${{ secrets.GCS_BUCKET_NAME }}       # Bucket name (e.g., gh_backups), no "gs://"
  BACKUP_BASE_PATH: backups                     # base folder in GCS bucket
  SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
  SLACK_CHANNEL: ${{ secrets.SLACK_CHANNEL }}
jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Send Slack alert - Backup started
        run: |
          payload='{"channel":"'"${{ env.SLACK_CHANNEL }}"'","username":"GitHub Actions","text":"🟡 GitHub repo backup *started* for `${{ github.repository }}`."}'
          curl -X POST -H 'Content-type: application/json' --data "$payload" "${{ env.SLACK_WEBHOOK_URL }}"
      
      - name: Set backup filename variable
        run: |
          REPO_NAME="${GITHUB_REPOSITORY//\//_}-backup-$(date +'%Y%m%d%H%M%S')"
          echo "BACKUP_FILE=${REPO_NAME}.tar.gz" >> $GITHUB_ENV
          echo "BACKUP_FOLDER=${REPO_NAME}" >> $GITHUB_ENV
          echo "REPO_PATH=${GITHUB_REPOSITORY//\//_}" >> $GITHUB_ENV
      
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'
      
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2.1.2
        with:
          version: 'latest'
      
      - name: Create git mirror backup
        run: git clone --mirror https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }} ${{ env.BACKUP_FOLDER }}
      
      - name: Tar backup
        run: tar czf "${{ env.BACKUP_FILE }}" "${{ env.BACKUP_FOLDER }}"
      
      - name: Upload backup to GCS
        id: upload
        uses: google-github-actions/upload-cloud-storage@v2
        with:
          path: ${{ env.BACKUP_FILE }}
          destination: ${{ env.BUCKET }}/${{ env.BACKUP_BASE_PATH }}/${{ env.REPO_PATH }}
          process_gcloudignore: false
      
      - name: Cleanup old backups in GCS (keep only 10 latest)
        run: |
          echo "Cleaning up old backups in GCS bucket..."
          existing=$(gsutil ls gs://${{ env.BUCKET }}/${{ env.BACKUP_BASE_PATH }}/${{ env.REPO_PATH }}/ | grep "$(echo '${{ github.repository }}' | tr '/' '_')" | sort)
          count=$(echo "$existing" | wc -l)
          if [ "$count" -gt 10 ]; then
            delete=$(echo "$existing" | head -n $(($count - 10)))
            echo "Deleting old backups:"
            echo "$delete"
            echo "$delete" | xargs -r gsutil rm
          else
            echo "No cleanup needed. Less than or equal to 10 backups."
          fi
      
      - name: Send Slack alert - Backup success
        if: success()
        run: |
          payload='{"channel":"'"${{ env.SLACK_CHANNEL }}"'","username":"GitHub Actions","text":"🟢 GitHub repo backup *success* for `${{ github.repository }}`."}'
          curl -X POST -H 'Content-type: application/json' --data "$payload" "${{ env.SLACK_WEBHOOK_URL }}"
      
      - name: Send Slack alert - Backup failed
        if: failure()
        run: |
          payload='{"channel":"'"${{ env.SLACK_CHANNEL }}"'","username":"GitHub Actions","text":"🔴 GitHub repo backup *FAILED* for `${{ github.repository }}`!"}'
          curl -X POST -H 'Content-type: application/json' --data "$payload" "${{ env.SLACK_WEBHOOK_URL }}"
